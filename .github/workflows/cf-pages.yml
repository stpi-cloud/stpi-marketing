name: deploy stpi-bible.pages.dev (+ independent getstpi smoke)
# 2026-09-27: the buyer-facing site lives on Cloudflare Pages (GitHub Pages was unreliable on
# phones). Every push to main rebuilds _cf/ (scripts/build_cf.py) and deploys it. Public repo:
# Actions minutes are free.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cf-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Build
        run: python scripts/build_cf.py
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      # 2026-10-01: getstpi is owned by stpi/.github/workflows/pages-deploy.yml (landing/ carries
      # the whole buyer site). This repo deploying it too created a two-owners trap that silently
      # half-split the live site (Pages serves a union of old assets and falls missing ones back to
      # index.html with a 200). Bible-only from now on; the smoke below still watches getstpi
      # from the outside, non-fatally.
      - name: Deploy the bible (stpi-bible.pages.dev, internal, noindex)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.145.0 pages deploy _cf_bible --project-name stpi-bible --branch main --commit-hash "$GITHUB_SHA" --commit-message "${GITHUB_SHA::7}"
      - name: Smoke (bible fatal; getstpi informational)
        run: |
          set -e
          for i in 1 2 3 4 5 6; do
            body=$(curl -fsSL https://stpi-bible.pages.dev/) || true
            card=$(echo "$body" | grep -o 'bible-assets/cards/[a-z0-9-]*-x.png' | head -1 || true)
            ok=1
            echo "$body" | grep -q "AUTO-SECTIONS" || ok=0
            [ -n "$card" ] && curl -fsSL -o /dev/null "https://stpi-bible.pages.dev/$card" || ok=0
            [ "$ok" = 1 ] && { echo "bible vault live"; break; }
            echo "edge not converged (attempt $i)"; [ "$i" = 6 ] && { echo "bible smoke failed"; exit 1; }; sleep 15
          done
          for u in / /demo /setup /downloads/stpi-demo-1.0.1.zip; do
            code=$(curl -s -o /dev/null -w '%{http_code}' -L "https://getstpi.pages.dev$u")
            echo "getstpi $code $u (owner: stpi repo; informational only)"
          done
